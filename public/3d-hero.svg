<svg width="720" height="540" viewBox="0 0 720 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#1E1B4B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pillarTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="pillarSideA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="pillarSideB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#312E81" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#67E8F9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="720" height="540" fill="url(#bg)"/>
  <rect width="720" height="540" fill="url(#glow)"/>

  <!-- Floating beams -->
  <g filter="url(#softGlow)">
    <rect x="140" y="120" width="440" height="8" fill="url(#beam)" opacity="0.7"/>
    <rect x="180" y="340" width="360" height="10" fill="url(#beam)" opacity="0.6"/>
  </g>

  <!-- Base grid -->
  <g opacity="0.15">
    <path d="M110 380 L360 500 L610 380 L360 260 Z" stroke="#94A3B8" stroke-width="1" />
    <path d="M160 355 L360 450 L560 355 L360 260 Z" stroke="#CBD5E1" stroke-width="1" />
    <path d="M210 330 L360 400 L510 330 L360 260 Z" stroke="#E2E8F0" stroke-width="1" />
  </g>

  <!-- Layered platform -->
  <g>
    <path d="M200 300 L360 220 L520 300 L360 380 Z" fill="#0B1935" opacity="0.85" />
    <path d="M220 310 L360 240 L500 310 L360 380 Z" fill="url(#pillarTop)" opacity="0.9" />
  </g>

  <!-- Pillar left -->
  <g filter="url(#softGlow)">
    <path d="M240 290 L310 255 L310 360 L240 395 Z" fill="url(#pillarSideA)" />
    <path d="M310 255 L380 290 L380 395 L310 360 Z" fill="url(#pillarSideB)" />
    <path d="M240 290 L310 255 L380 290 L310 325 Z" fill="url(#pillarTop)" />
  </g>

  <!-- Pillar center -->
  <g filter="url(#softGlow)">
    <path d="M320 260 L380 230 L380 375 L320 405 Z" fill="url(#pillarSideA)" />
    <path d="M380 230 L440 260 L440 405 L380 375 Z" fill="url(#pillarSideB)" />
    <path d="M320 260 L380 230 L440 260 L380 290 Z" fill="url(#pillarTop)" />
  </g>

  <!-- Pillar right -->
  <g filter="url(#softGlow)">
    <path d="M400 285 L470 250 L470 370 L400 405 Z" fill="url(#pillarSideA)" />
    <path d="M470 250 L540 285 L540 405 L470 370 Z" fill="url(#pillarSideB)" />
    <path d="M400 285 L470 250 L540 285 L470 320 Z" fill="url(#pillarTop)" />
  </g>

  <!-- Floating nodes -->
  <g filter="url(#softGlow)">
    <circle cx="520" cy="150" r="34" fill="#67E8F9" opacity="0.6"/>
    <circle cx="190" cy="150" r="24" fill="#A855F7" opacity="0.6"/>
    <circle cx="360" cy="110" r="26" fill="#22D3EE" opacity="0.45"/>
  </g>
</svg>
