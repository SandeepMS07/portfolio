<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Scoring pipeline">
  <defs>
    <pattern id="dots-sp" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#ffffff10"/>
    </pattern>
    <marker id="arr-sp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff5e2c"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#0a0b0f"/>
  <rect width="800" height="450" fill="url(#dots-sp)"/>

  <text x="40" y="36" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2.5" fill="#ff5e2c">FIG · 02 // LIVE SCORING PIPELINE</text>

  <!-- 5 stages, evenly spaced -->
  <g font-family="ui-sans-serif, system-ui" fill="#f4f5f7">
    <g>
      <rect x="40" y="160" width="130" height="80" rx="12" fill="#16171e" stroke="#ffffff20" stroke-dasharray="4 4"/>
      <text x="105" y="195" text-anchor="middle" font-size="13" font-weight="700">iSportz</text>
      <text x="105" y="213" text-anchor="middle" font-size="10" font-family="ui-monospace, monospace" fill="#ff9347">JSONP feeds</text>
      <text x="105" y="227" text-anchor="middle" font-size="9" font-family="ui-monospace, monospace" fill="#8c8c97">every few seconds</text>
    </g>
    <g>
      <rect x="190" y="160" width="120" height="80" rx="12" fill="#16171e" stroke="#ffffff20"/>
      <text x="250" y="190" text-anchor="middle" font-size="12" font-weight="700">Ingest</text>
      <text x="250" y="208" text-anchor="middle" font-size="10" font-family="ui-monospace, monospace" fill="#ff9347">BullMQ worker</text>
      <text x="250" y="222" text-anchor="middle" font-size="9" font-family="ui-monospace, monospace" fill="#8c8c97">retry · backoff</text>
    </g>
    <g>
      <rect x="330" y="160" width="120" height="80" rx="12" fill="#16171e" stroke="#ffffff20"/>
      <text x="390" y="190" text-anchor="middle" font-size="12" font-weight="700">Normalise</text>
      <text x="390" y="208" text-anchor="middle" font-size="10" font-family="ui-monospace, monospace" fill="#ff9347">resolver</text>
      <text x="390" y="222" text-anchor="middle" font-size="9" font-family="ui-monospace, monospace" fill="#8c8c97">vendor → canonical</text>
    </g>
    <g>
      <rect x="470" y="160" width="120" height="80" rx="12" fill="#16171e" stroke="#ffffff20"/>
      <text x="530" y="190" text-anchor="middle" font-size="12" font-weight="700">Score</text>
      <text x="530" y="208" text-anchor="middle" font-size="10" font-family="ui-monospace, monospace" fill="#ff9347">BRD point rules</text>
      <text x="530" y="222" text-anchor="middle" font-size="9" font-family="ui-monospace, monospace" fill="#8c8c97">snapshot · pure</text>
    </g>
    <g>
      <rect x="610" y="160" width="150" height="80" rx="12" fill="#0a0b0f" stroke="#ff5e2c" stroke-width="1.8"/>
      <text x="685" y="190" text-anchor="middle" font-size="12" font-weight="700">Upsert + Fan-out</text>
      <text x="685" y="208" text-anchor="middle" font-size="10" font-family="ui-monospace, monospace" fill="#ff9347">PG + WebSocket</text>
      <text x="685" y="222" text-anchor="middle" font-size="9" font-family="ui-monospace, monospace" fill="#8c8c97">replay-safe</text>
    </g>
  </g>

  <!-- arrows -->
  <g stroke="#ff5e2c" stroke-width="1.5" fill="none" marker-end="url(#arr-sp)">
    <line x1="170" y1="200" x2="190" y2="200"/>
    <line x1="310" y1="200" x2="330" y2="200"/>
    <line x1="450" y1="200" x2="470" y2="200"/>
    <line x1="590" y1="200" x2="610" y2="200"/>
  </g>

  <!-- side note: replay-safe pattern -->
  <g>
    <line x1="685" y1="240" x2="685" y2="310" stroke="#ff5e2c" stroke-width="1.2" stroke-dasharray="2 4"/>
    <rect x="540" y="310" width="290" height="74" rx="10" fill="#16171e" stroke="#ffffff14"/>
    <text x="555" y="332" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.5" fill="#ff9347">REPLAY-SAFE PATTERN</text>
    <text x="555" y="354" font-family="ui-monospace, monospace" font-size="11" fill="#f4f5f7">SET points = $new</text>
    <text x="555" y="371" font-family="ui-monospace, monospace" font-size="11" fill="#8c8c97">// never points += $delta</text>
  </g>

  <!-- side note: WS channel scope -->
  <g>
    <line x1="685" y1="160" x2="685" y2="100" stroke="#ff5e2c" stroke-width="1.2" stroke-dasharray="2 4"/>
    <rect x="510" y="60" width="270" height="42" rx="10" fill="#16171e" stroke="#ffffff14"/>
    <text x="520" y="80" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.5" fill="#ff9347">PER-MATCH CHANNEL</text>
    <text x="520" y="95" font-family="ui-monospace, monospace" font-size="10" fill="#8c8c97">subscribe(match_id) — bandwidth -95%</text>
  </g>

  <!-- footer label -->
  <text x="400" y="425" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.5" fill="#8c8c97">snapshot · normalise · score · upsert · broadcast — every step is replayable</text>
</svg>
