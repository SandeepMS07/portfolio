<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="System topology">
  <defs>
    <pattern id="dots-st" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#ffffff10"/>
    </pattern>
    <marker id="arrow-st" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff5e2c"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#0a0b0f"/>
  <rect width="800" height="450" fill="url(#dots-st)"/>

  <text x="40" y="36" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2.5" fill="#ff5e2c">FIG · 01 // SYSTEM TOPOLOGY</text>

  <g font-family="ui-sans-serif, system-ui" font-size="13" fill="#f4f5f7">
    <g>
      <rect x="40" y="80" width="170" height="60" rx="12" fill="#16171e" stroke="#ffffff20"/>
      <text x="60" y="106" font-weight="600">Consumer Web</text>
      <text x="60" y="125" font-size="10" font-family="ui-monospace, monospace" fill="#8c8c97">next.js · fantasy-frontend</text>
    </g>
    <g>
      <rect x="40" y="170" width="170" height="60" rx="12" fill="#16171e" stroke="#ffffff20"/>
      <text x="60" y="196" font-weight="600">Admin Console</text>
      <text x="60" y="215" font-size="10" font-family="ui-monospace, monospace" fill="#8c8c97">next.js · t20-web admin</text>
    </g>
    <g>
      <rect x="40" y="260" width="170" height="60" rx="12" fill="#16171e" stroke="#ffffff20"/>
      <text x="60" y="286" font-weight="600">Mobile App</text>
      <text x="60" y="305" font-size="10" font-family="ui-monospace, monospace" fill="#8c8c97">capacitor + ionic react</text>
    </g>
  </g>

  <g>
    <rect x="320" y="160" width="180" height="90" rx="14" fill="#0a0b0f" stroke="#ff5e2c" stroke-width="1.8"/>
    <text x="410" y="190" text-anchor="middle" font-family="ui-sans-serif, system-ui" font-size="15" font-weight="700" fill="#f4f5f7">Fantasy Backend</text>
    <text x="410" y="210" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#ff9347">fastify · node · ts</text>
    <text x="410" y="232" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1.5" fill="#8c8c97">REST · WS · JWT · BULLMQ</text>
  </g>

  <g font-family="ui-sans-serif, system-ui" font-size="12" fill="#f4f5f7">
    <g>
      <rect x="590" y="100" width="170" height="50" rx="10" fill="#16171e" stroke="#ffffff20"/>
      <text x="675" y="123" text-anchor="middle" font-weight="600">PostgreSQL</text>
      <text x="675" y="140" text-anchor="middle" font-size="10" font-family="ui-monospace, monospace" fill="#8c8c97">source of truth</text>
    </g>
    <g>
      <rect x="590" y="170" width="170" height="50" rx="10" fill="#16171e" stroke="#ffffff20"/>
      <text x="675" y="193" text-anchor="middle" font-weight="600">Redis</text>
      <text x="675" y="210" text-anchor="middle" font-size="10" font-family="ui-monospace, monospace" fill="#8c8c97">cache · queue · pubsub</text>
    </g>
  </g>

  <g font-family="ui-sans-serif, system-ui" font-size="12" fill="#f4f5f7">
    <g>
      <rect x="590" y="260" width="170" height="50" rx="10" fill="#16171e" stroke="#ffffff20" stroke-dasharray="4 4"/>
      <text x="675" y="283" text-anchor="middle" font-weight="600">iSportz CDN</text>
      <text x="675" y="300" text-anchor="middle" font-size="10" font-family="ui-monospace, monospace" fill="#8c8c97">live cricket feeds</text>
    </g>
    <g>
      <rect x="590" y="330" width="170" height="50" rx="10" fill="#16171e" stroke="#ffffff20" stroke-dasharray="4 4"/>
      <text x="675" y="353" text-anchor="middle" font-weight="600">Gupshup</text>
      <text x="675" y="370" text-anchor="middle" font-size="10" font-family="ui-monospace, monospace" fill="#8c8c97">DLT-compliant SMS</text>
    </g>
  </g>

  <g stroke="#ff5e2c" stroke-width="1.5" fill="none" marker-end="url(#arrow-st)">
    <path d="M 215 110 Q 270 110, 320 180"/>
    <path d="M 215 200 L 320 205"/>
    <path d="M 215 290 Q 270 290, 320 230"/>
  </g>

  <g stroke="#ff5e2c" stroke-width="1.5" fill="none" marker-end="url(#arrow-st)">
    <path d="M 505 180 Q 545 130, 585 125"/>
    <path d="M 505 200 L 585 195"/>
    <path d="M 505 220 Q 545 270, 585 285"/>
    <path d="M 505 240 Q 545 340, 585 355"/>
  </g>

  <text x="400" y="425" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.5" fill="#8c8c97">3 frontends · 1 backend · 2 stores · 2 vendors</text>
</svg>
