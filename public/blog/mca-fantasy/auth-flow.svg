<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Auth flow with grace window">
  <defs>
    <pattern id="dots-au" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#ffffff10"/>
    </pattern>
    <marker id="arr-au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff5e2c"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#0a0b0f"/>
  <rect width="800" height="450" fill="url(#dots-au)"/>

  <text x="40" y="36" font-family="ui-monospace, monospace" font-size="10" letter-spacing="2.5" fill="#ff5e2c">FIG · 04 // ROTATING JWT WITH 30s GRACE WINDOW</text>

  <!-- swim lanes -->
  <g font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.5" fill="#8c8c97">
    <text x="50" y="80">TAB A</text>
    <text x="50" y="200">TAB B</text>
    <text x="50" y="350">BACKEND</text>
  </g>
  <line x1="120" y1="65" x2="760" y2="65" stroke="#ffffff10"/>
  <line x1="120" y1="185" x2="760" y2="185" stroke="#ffffff10"/>
  <line x1="120" y1="335" x2="760" y2="335" stroke="#ffffff10"/>

  <!-- step boxes / actions -->
  <g font-family="ui-sans-serif, system-ui" font-size="11" fill="#f4f5f7">
    <!-- Tab A -->
    <g>
      <rect x="130" y="82" width="140" height="50" rx="10" fill="#16171e" stroke="#ffffff20"/>
      <text x="200" y="103" text-anchor="middle" font-weight="600" font-size="12">1. access expired</text>
      <text x="200" y="120" text-anchor="middle" font-size="10" fill="#8c8c97" font-family="ui-monospace, monospace">refresh w/ cookie</text>
    </g>
    <g>
      <rect x="300" y="82" width="140" height="50" rx="10" fill="#16171e" stroke="#ffffff20"/>
      <text x="370" y="103" text-anchor="middle" font-weight="600" font-size="12">2. wins rotation</text>
      <text x="370" y="120" text-anchor="middle" font-size="10" fill="#8c8c97" font-family="ui-monospace, monospace">new RT in cookie</text>
    </g>

    <!-- Tab B -->
    <g>
      <rect x="300" y="202" width="160" height="50" rx="10" fill="#16171e" stroke="#ffffff20"/>
      <text x="380" y="223" text-anchor="middle" font-weight="600" font-size="12">3. refresh w/ STALE</text>
      <text x="380" y="240" text-anchor="middle" font-size="10" fill="#8c8c97" font-family="ui-monospace, monospace">old RT cookie</text>
    </g>
    <g>
      <rect x="490" y="202" width="170" height="50" rx="10" fill="#0a0b0f" stroke="#ff5e2c" stroke-width="1.8"/>
      <text x="575" y="223" text-anchor="middle" font-weight="700" font-size="12">4. grace match</text>
      <text x="575" y="240" text-anchor="middle" font-size="10" fill="#ff9347" font-family="ui-monospace, monospace">issued NEW access</text>
    </g>

    <!-- Backend -->
    <g>
      <rect x="300" y="350" width="140" height="60" rx="10" fill="#16171e" stroke="#ffffff20"/>
      <text x="370" y="375" text-anchor="middle" font-weight="600" font-size="12">DB: rotate</text>
      <text x="370" y="392" text-anchor="middle" font-size="10" fill="#8c8c97" font-family="ui-monospace, monospace">SET refresh_hash</text>
    </g>
    <g>
      <rect x="490" y="350" width="170" height="60" rx="10" fill="#0a0b0f" stroke="#ff5e2c" stroke-width="1.8"/>
      <text x="575" y="375" text-anchor="middle" font-weight="700" font-size="12">Redis: grace key</text>
      <text x="575" y="392" text-anchor="middle" font-size="10" fill="#ff9347" font-family="ui-monospace, monospace">EX 30 — old hash</text>
    </g>
  </g>

  <!-- arrows -->
  <g stroke="#ff5e2c" stroke-width="1.5" fill="none" marker-end="url(#arr-au)">
    <path d="M 270 107 L 300 107"/>
    <path d="M 370 132 L 370 350"/>
    <path d="M 440 380 L 490 380"/>
    <path d="M 460 227 L 490 227"/>
    <path d="M 575 250 Q 575 300, 575 350" stroke-dasharray="3 5"/>
  </g>

  <text x="400" y="435" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.5" fill="#8c8c97">one-time-use rotation · 30s grace window absorbs the multi-tab race</text>
</svg>
